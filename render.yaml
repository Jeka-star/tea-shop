services:
  - type: web
    name: tea-shop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tea-db
          property: connectionString

databases:
  - name: tea-db
    plan: free
    databaseName: tea
    user: tea
